function profile(){const p=state.profile||{id:'DEMO001',name:'하닉',join:plus(-120),cl:'CL2',site:'이천',married:false,children:0,dorm:true,vip:true};modal(`<h2>트레이너 프로필</h2><p class="small">실제 사번 대신 데모 정보를 사용하세요.</p><form id="profileForm"><label>데모 사번<input name="id" required value="${esc(p.id)}" maxlength="30"></label><label>이름<input name="name" required value="${esc(p.name)}" maxlength="20"></label><div class="fields"><label>입사일<input type="date" name="join" required max="${today()}" value="${p.join}"></label><label>직급<select name="cl">${['CL1','CL2','CL3','CL4'].map(v=>`<option ${v===p.cl?'selected':''}>${v}</option>`).join('')}</select></label><label>근무지<select name="site">${['이천','청주','분당'].map(v=>`<option ${v===p.site?'selected':''}>${v}</option>`).join('')}</select></label><label>자녀 수<input name="children" type="number" min="0" max="10" required value="${p.children}"></label></div>${[['married','기혼'],['dorm','기숙사 거주'],['vip','SKT VIP 연동 (데모)']].map(([k,n])=>`<label>${n}<select name="${k}"><option value="yes" ${p[k]?'selected':''}>예</option><option value="no" ${!p[k]?'selected':''}>아니요</option></select></label>`).join('')}<button class="primary wide" type="submit">대상 복지 자동 매칭</button></form><button class="wide" onclick="resetPrompt()">데모 데이터 초기화</button>`);$('profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.profile=Object.fromEntries(f);state.profile.children=Number(f.get('children'));['married','dorm','vip'].forEach(k=>state.profile[k]=f.get(k)==='yes');save();closeModal();render();modal(`<h2>매칭 완료 ✨</h2><p>받을 수 있는 복지 <b>${eligible().length}종</b> · 14일 내 마감 <b>${eligible().filter(b=>days(b)!==null&&days(b)>=0&&days(b)<=14&&!got(b.id)).length}개</b></p>${benefits.map(b=>`<p>${eligibility(b)?'○':'✓'} ${b.title}<br><span class="small">${eligibility(b)||'대상 조건 충족'} · ${b.reg}</span></p>`).join('')}`)}}
function home(){let due=eligible().filter(b=>days(b)!==null&&days(b)>=0&&days(b)<=14&&!got(b.id));$('view').innerHTML=`<div class="row"><div><div class="small">${esc(state.profile.name)} 트레이너님의</div><h2>오늘의 복지 모험</h2></div><span class="pill">이천 캠퍼스</span></div><div class="hud" style="margin-top:15px"><div><b>LV.${level()}</b><small>${xp()} XP</small></div><div><b>${rate()}%</b><small>${collected().length}/${eligible().length} 포획</small></div><div><b>${streak()}일</b><small>사용 스트릭</small></div></div><div class="card trainer"><p>✨ 이번 달 안 쓴 야생 복지 <b>${eligible().filter(b=>days(b)!==null&&days(b)>=0&&days(b)<=30&&!got(b.id)).length}마리</b>가 있어요. 지금 쓸 수 있는 혜택부터 찾아볼까요?</p></div><div class="map"><svg viewBox="0 0 390 325"><path d="M-20 100L410 120M-20 245L410 235M170 -20L180 350" fill="none" stroke="#f8fbec" stroke-width="35"/><path d="M0 300Q150 250 210 310T420 260" fill="none" stroke="#93dce6" stroke-width="22"/><g fill="#9fc1d2" stroke="#fff" stroke-width="4"><rect x="75" y="140" width="64" height="55" rx="12"/><rect x="215" y="155" width="55" height="40" rx="9"/></g><g fill="#88c38e"><circle cx="35" cy="155" r="17"/><circle cx="345" cy="160" r="20"/><circle cx="130" cy="35" r="18"/><circle cx="50" cy="280" r="14"/></g></svg>${stores.map(s=>`<button class="spot" style="left:${s.x}%;top:${s.y}%" onclick="locationTrigger('${s.id}')"><strong>${s.emoji}</strong>${s.id==='ice'?'아이스크림':s.id.startsWith('food')?'제휴 식당':s.name}</button>`).join('')}<div class="avatar">${creature(by('point'),68)}</div><div class="maplabel">✦ 데모 캠퍼스 지도 · 핀을 눌러 혜택 확인</div></div><div class="card"><label style="margin:0">📍 위치 시뮬레이터<select id="location" onchange="if(this.value)locationTrigger(this.value)"><option value="">이동할 장소 선택</option>${stores.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><div class="small">실제 GPS·백그라운드 알림은 사용하지 않습니다.</div></div><div id="push"></div>${due.map(b=>`<div class="card deadline"><b>D-${days(b)} ${b.title} 마감</b><p>${b.id==='health'?'지정 병원 3곳의 예약 정보를 확인하세요.':'사용하지 않은 혜택이 곧 마감돼요.'}</p><button class="wide" onclick="reserve('${b.id}')">${state.reservations.includes(b.id)?'예약 정보 보기':'예약하고 포획 알림 받기'}</button></div>`).join('')}<div class="demo">복지·규정은 예시 · 브라우저 로컬 저장</div>`}
function optimize(s,amount=s.amount){if(!Number.isFinite(amount)||amount<1||amount>10000000)throw Error('1~10,000,000원 사이 금액을 입력하세요.');let discount=eligibility(by(s.benefit))?0:Math.min(Math.floor(amount*s.rate),s.cap),points=eligibility(by('point'))?0:Math.min(state.points,amount-discount);return {amount,discount,points,total:discount+points,cash:amount-discount-points}}
function locationTrigger(id){activeStore=id;let s=stores.find(s=>s.id===id),r=optimize(s);if(!r.total)return toast('이 매장에서 적용 가능한 혜택이 없습니다. 프로필을 확인하세요.');if(tab!=='map'){tab='map';render()}let key=id+today();if(state.notifications[key]){$('push').innerHTML=`<div class="card"><p>오늘 이 매장의 알림을 이미 확인했어요.</p><button class="wide" onclick="agent()">혜택 다시 계산하기</button></div>`;return}state.notifications[key]=true;save();$('push').innerHTML=`<button class="card alert wide" onclick="agent()"><h3>${s.emoji} ${s.name} 근처예요!</h3><p>쓸 수 있는 혜택 ${Number(r.discount>0)+Number(r.points>0)}개 · 최대 ${money(r.total)} 활용</p><span class="small">실제 할인 ${money(r.discount)} + 기존 포인트 ${money(r.points)}</span></button>${!eligibility(by(s.benefit))?`<div class="card"><p>🌸 야생의 ${by(s.benefit).name} 출현! 혜택 사용을 확인하면 포획돼요.</p></div>`:''}`;$('push').scrollIntoView({behavior:'smooth',block:'nearest'})}
const pause=ms=>new Promise(r=>setTimeout(r,ms));async function steps(labels,onDone){let token=++flow;$('view').innerHTML=`<div class="row"><h2>AI 복지 트레이너</h2><span class="pill">● DEMO LIVE</span></div><p class="small">도구 실행 과정을 데모 스크립트로 재생합니다.</p><div id="steps"></div>`;for(let [title,detail]of labels){if(token!==flow)return;let e=document.createElement('div');e.className='step running';e.innerHTML=`<span class="spin">◌</span> ${title}<small>${esc(detail)}</small>`;$('steps').append(e);await pause(550);if(token!==flow)return;e.className='step';e.innerHTML=`✓ ${title}<small>${esc(detail)}</small>`}if(token===flow)onDone()}
function agent(amount){let s=stores.find(s=>s.id===activeStore),r;try{r=optimize(s,amount===undefined?s.amount:Number(amount))}catch(e){return toast(e.message)}steps([['📍 위치 확인',s.name+' · 데모 제휴 매장'],['🔍 혜택 조회','제휴 할인, 멤버십, 복지포인트 검색'],['🧾 자격 확인',(!eligibility(by(s.benefit))?'매장 혜택 대상 ✓':'매장 할인 비대상')+' · 포인트 잔액 '+money(state.points)],['🧮 최적 조합 계산','정률 할인 → 포인트 결제 · 중복 할인 없음']],()=>{$('view').innerHTML+=`<div class="card"><span class="pill rare">최적 결제안</span><h2 style="margin-top:10px">${money(r.total)} 혜택 활용</h2><p>① 멤버십/제휴 할인 <b>${money(r.discount)}</b><br>② 소멸 예정 복지포인트 <b>${money(r.points)}</b><br>③ 나의 결제 금액 <b>${money(r.cash)}</b></p><p class="small">포인트는 기존 잔액 사용이며 추가 할인은 아닙니다.<br>근거 ${by(s.benefit).reg} · REG-007</p><label>결제 예정 금액<input id="amount" type="number" min="1" max="10000000" value="${r.amount}"></label><button class="wide" onclick="agent($('amount').value)">금액 변경 후 다시 계산</button><button class="wide" onclick="barcode()">결제할 때 데모 바코드 보기</button><button class="primary wide" onclick="receipt(${r.amount})">혜택 사용 후 영수증 확인 →</button></div>`})}
function barcode(){modal(`<h2>데모 멤버십 카드</h2><div style="height:100px;margin:22px 10px;background:repeating-linear-gradient(90deg,#1c2f5e 0 3px,white 3px 6px,#1c2f5e 6px 7px,white 7px 11px)"></div><p class="small">실제 결제에 사용할 수 없는 데모 바코드입니다.<br>DEMO · ${esc(state.profile.id)}</p>`)}
function reserve(id){if(!state.reservations.includes(id)){state.reservations.push(id);save()}modal(`<h2>${by(id).title} 예약 안내</h2><p>✓ 예약 알림 등록 완료 (데모)</p><p>지정 병원 A · B · C<br>예시 상담 시간: 평일 09:00–17:00</p><p class="small">실제 예약은 해당 복지 채널에서 진행하세요. 예약만으로는 포획되지 않습니다. · ${by(id).reg}</p><button class="primary wide" onclick="closeModal();activeStore='${id}';receipt(0)">이용 완료 증빙 확인</button>`)}
let receiptAmount=6000;function receipt(amount){receiptAmount=amount;pendingHash=null;receiptURL=null;$('view').innerHTML=`<h2>사용 확인으로 포획하기</h2><p class="small">데모 OCR · 실제 자동 인식은 연결되지 않았습니다.</p><div class="card"><h3>1. 영수증 또는 이용 증빙</h3><label>이미지 선택<input id="upload" type="file" accept="image/*" capture="environment" onchange="uploadReceipt(this.files[0])"></label><div id="preview"></div><button class="wide" onclick="sampleReceipt()">샘플 영수증으로 시연</button></div><div id="manual"></div>`}
async function hashBlob(blob){let buf=new Uint8Array(await blob.arrayBuffer());if(globalThis.crypto?.subtle){let hash=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(let x of buf)h=Math.imul(h^x,16777619);return buf.length+'-'+(h>>>0).toString(16)}
async function uploadReceipt(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택하세요.');if(file.size>10*1024*1024)return toast('10MB 이하 이미지를 선택하세요.');pendingHash=await hashBlob(file);if(state.hashes.includes(pendingHash))return toast('이미 확인한 영수증입니다. 중복 포획을 막았어요.');receiptURL=URL.createObjectURL(file);$('preview').innerHTML=`<div class="preview"><img class="receipt" src="${receiptURL}" alt="업로드한 영수증 미리보기"><div class="scan"></div></div>`;await pause(1000);$('preview').querySelector('.scan')?.remove();manualReceipt(false)}
async function sampleReceipt(){pendingHash='demo-receipt-'+activeStore+'-'+today();if(state.hashes.includes(pendingHash))return toast('오늘의 샘플 영수증은 이미 사용했습니다.');let s=stores.find(s=>s.id===activeStore);$('preview').innerHTML=`<div class="card" style="font-family:monospace;text-align:center"><b>DEMO RECEIPT</b><p>${s?.name||by(activeStore).title+' 이용처'}<br>${today()}<br>결제 ${money(receiptAmount)}<br>혜택 사용 확인 · DEMO</p></div>`;manualReceipt(true)}
function manualReceipt(sample){let s=stores.find(s=>s.id===activeStore),b=s?by(s.benefit):by(activeStore);$('manual').innerHTML=`<div class="card"><span class="pill">${sample?'샘플 데이터':'OCR 미연결 → 수동 확인'}</span><h3 style="margin-top:12px">2. 사용 내역 확인</h3><p class="small">이미지를 실제로 읽은 결과가 아닙니다. 아래 정보를 직접 확인하세요.</p><label>사용 매장<input id="receiptStore" value="${s?.name||by(activeStore).title+' 이용처'}"></label><label>사용일<input id="receiptDate" type="date" value="${today()}" max="${today()}"></label><label>결제 금액<input id="receiptValue" type="number" min="${s?1:0}" max="10000000" value="${receiptAmount}"></label><label>사용한 복지<select id="receiptBenefit">${eligible().filter(x=>(s?[s.benefit,'point']:[activeStore]).includes(x.id)).map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${x.title}</option>`).join('')}</select></label><p class="small">영수증 1장당 선택한 복지 1종 포획. ${b.reg}</p><button class="primary wide" onclick="confirmReceipt()">내역 확인 완료 · 데모 인증</button></div>`}
function confirmReceipt(){let id=$('receiptBenefit').value,s=stores.find(s=>s.id===activeStore),amount=Number($('receiptValue').value),date=$('receiptDate').value,store=$('receiptStore').value.trim();if(!pendingHash)return toast('증빙을 먼저 선택하세요.');if(state.hashes.includes(pendingHash))return toast('이미 사용한 영수증입니다.');if(got(id))return toast('이미 포획한 복지입니다.');if(eligibility(by(id)))return toast('대상 자격을 확인하세요.');if(days(by(id))!==null&&days(by(id))<0)return toast('마감된 복지입니다.');if(!store||!date||date>today()||!Number.isFinite(amount)||amount<(s?1:0)||amount>10000000)return toast('매장·날짜·금액을 확인하세요.');if(s&&store!==s.name)return toast('추천한 매장명과 일치하지 않습니다.');if(id==='point'&&state.points===0)return toast('사용할 복지포인트가 없습니다.');let r=s?optimize(s,amount):{discount:0,points:0};if(id==='point'&&!r.points)return toast('포인트 사용액이 없습니다.');state.hashes.push(pendingHash);if(s)state.points-=r.points;capture(id,{date,store,amount,saved:r.discount,points:r.points,hash:pendingHash,method:'demo-manual'})}
async function capture(id,meta={}){let old=level(),oldBadges=badges();state.usage.push({benefit:id,date:today(),...meta});save();let b=by(id),token=++flow;$('nav').style.display='none';$('view').innerHTML=`<div class="capture"><span class="pill ${b.rarity}">${b.title} 사용 확인</span><h2 style="margin:20px 0">야생의 ${b.name}!</h2>${creature(b,185)}<div id="caps" class="capsule">${capsule(80)}</div><p id="captureText">꽃봉오리 캡슐이 열려요…</p></div>`;$('caps').classList.add('throw');await pause(1000);if(token!==flow)return;$('caps').className='capsule shake';await pause(1800);if(token!==flow)return;$('captureText').innerHTML=`<b class="success">✦ 포획 성공! ✦</b><br>+${b.xp} XP · 도감에 등록했어요.<button class="primary wide" onclick="navigate('dex')">도감에서 만나기 →</button><button class="wide" onclick="navigate('map')">모험 계속하기</button>`;let earned=badges().filter(x=>!oldBadges.includes(x));if(earned.length)toast('새 뱃지: '+earned.join(' · '));if(level()>old)modal(`<div class="level card"><span class="pill">LEVEL UP</span><h1>LV.${level()}</h1><p>트레이너의 모험이 한 단계 성장했어요!</p></div>`)}
function dex(){$('view').innerHTML=`<h2>나의 복지 도감</h2><p class="small">사용한 혜택이 나만의 꽃송이로 피어나요.</p><div class="card"><div class="row"><b>${collected().length} / ${eligible().length} 대상 복지</b><h2>${rate()}%</h2></div><div class="progress"><i style="width:${rate()}%"></i></div></div><div class="chips">${[['all','전체'],['common','일반'],['rare','희귀'],['legendary','전설']].map(([k,n])=>`<button class="${filter===k?'blue':''}" onclick="filter='${k}';dex()">${n}</button>`).join('')}</div><div class="grid">${benefits.filter(b=>filter==='all'||b.rarity===filter).map(b=>`<button class="mon ${got(b.id)?'':'locked'}" onclick="detail('${b.id}')">${creature(b,90)}<b>${got(b.id)?b.name:'???'}</b><span class="pill ${b.rarity}">${{common:'일반',rare:'희귀',legendary:'전설'}[b.rarity]}</span><div class="small">${eligibility(b)?'비대상':days(b)!==null?'D-'+days(b):'대상 복지'}</div></button>`).join('')}</div>`}
function detail(id){let b=by(id),u=state.usage.find(x=>x.benefit===id);modal(`<div style="text-align:center">${creature(b,145)}<h2>${b.name}</h2><span class="pill ${b.rarity}">${b.title} · +${b.xp} XP</span></div><p>${b.desc}</p><p class="small">자격: ${eligibility(b)||'현재 프로필 대상'}<br>근거 규정 ${b.reg}${days(b)!==null?'<br>마감까지 '+days(b)+'일':''}<br>${u?'획득일 '+u.date+' · '+esc(u.store||'데모 신청 승인'):'사용 완료 증빙을 확인하면 포획돼요.'}</p>${u?`<div class="card"><p>인증 방식: ${u.method==='demo-manual'?'데모 수동 확인':'HR 승인 시뮬레이션'}<br>${u.amount!==undefined?'결제 '+money(u.amount):''}</p><p class="small">증빙 이미지는 개인정보 보호를 위해 저장하지 않습니다.</p></div>`:`<button class="primary wide" onclick="closeModal();navigate('chat');ask('${b.title} 알려줘')">AI 트레이너에게 물어보기</button>${!eligibility(b)&&!['wed','edu','tenure'].includes(id)?`<button class="wide" onclick="closeModal();activeStore='${id}';receipt(0)">사용 완료 증빙 확인</button>`:''}`}`)}
function bag(){$('view').innerHTML=`<h2>트레이너의 가방</h2><div class="card"><div class="row"><b>복지포인트 잔액</b><h2>${money(state.points)}</h2></div><p class="small">예시 포인트 · 분기 내 사용 권장</p></div><h3 style="margin-top:20px">획득한 뱃지</h3><div class="chips">${badges().map(x=>`<span class="pill">${x}</span>`).join('')||'<p class="small">첫 혜택을 사용하면 첫 포획 뱃지를 받아요.</p>'}</div><h3 style="margin-top:20px">신청 내역</h3>${state.applications.map(a=>`<div class="card"><b>${by(a.benefit).title}</b><p>${a.status==='approved'?'승인 완료':'데모 제출 · 승인 대기'} · ${esc(a.fields?.eventDate||'')}</p>${a.status==='submitted'?`<button class="wide" onclick="approve('${a.id}')">HR 승인 시뮬레이션</button>`:''}</div>`).join('')||'<p class="small">저장된 신청 내역이 없습니다.</p>'}<h3 style="margin-top:20px">내 복지 카드</h3>${state.usage.map(u=>`<button class="card wide row" onclick="detail('${u.benefit}')">${creature(by(u.benefit),65)}<div><b>${by(u.benefit).name}</b><p class="small">${by(u.benefit).title} · ${u.date}</p></div>→</button>`).join('')||'<div class="empty">🌱<p>아직 피어난 꽃송이가 없어요.<br>지도에서 첫 혜택을 찾아보세요.</p></div>'}`}
let chatBusy=false;
state.messages=Array.isArray(state.messages)?state.messages:[];
function conversation(){return state.messages.map(m=>`<div class="chat ${m.role==='user'?'user':''}"><div class="small" style="margin-bottom:5px">${m.role==='user'?'나':'✨ 복지 트레이너'} · ${esc(m.time||'')}</div><p style="white-space:pre-wrap">${esc(m.text)}</p>${(m.actions||[]).map(a=>a.type==='application'?`<button class="wide" onclick="prepareApplication('${a.id==='wed'?'결혼해요':'아이가 입학해요'}')">${a.id==='wed'?'결혼':'자녀 학자금'} 신청서 준비 →</button>`:a.type==='map'?`<button class="wide" onclick="navigate('map')">지도에서 혜택 확인 →</button>`:`<button class="wide" onclick="detail('${a.id}')">${by(a.id).emoji} ${by(a.id).title} 상세 보기</button>`).join('')}</div>`).join('')}
function chat(){
$('view').innerHTML=`<div class="row"><h2>AI 복지 트레이너</h2><span class="pill">DEMO</span></div><div class="chat">안녕하세요, ${esc(state.profile.name)} 트레이너님! 어떤 복지가 궁금하세요?<br><span class="small">규칙 기반 데모 응답 · 실제 LLM 연결 없음<br>대화는 이 브라우저에 저장됩니다. 데모 정보로 대화하세요.</span></div><div class="chips">${['집사고 싶어','저 다음 달에 결혼해요','이사해요','아이가 입학해요','여기서 뭐 쓸 수 있어?'].map(t=>`<button ${chatBusy?'disabled':''} onclick="ask('${t}')">${t}</button>`).join('')}</div><div id="messages" role="log" aria-label="트레이너 대화" aria-live="polite">${conversation()}${chatBusy?'<div class="chat" id="typing"><span class="spin">◌</span> 트레이너가 관련 복지를 확인하고 있어요…</div>':''}</div><form id="chatForm"><label>트레이너에게 질문<input id="question" placeholder="예: 집사고 싶어" required maxlength="300" ${chatBusy?'disabled':''}></label><button class="primary wide" ${chatBusy?'disabled':''}>${chatBusy?'답변 확인 중…':'보내기 ✨'}</button></form>`;
$('chatForm').onsubmit=e=>{e.preventDefault();ask($('question').value)};
}
function demoAnswer(text){
const last=state.messages.filter(m=>m.role==='user').slice(-2)[0]?.text||'';
if(/집.*(사|매매|구매)|내\s*집|주택|주거|전세|대출/.test(text)||(/얼마|어떻게|가능|조건/.test(text)&&/집.*사|주택|전세|대출/.test(last)))return {text:'내 집 마련을 생각하고 계시는군요! 현재 예시 규정에는 주택 구입 지원금이나 주택 대출 항목이 없어서, 지원 금액과 자격을 확정해 드릴 수는 없어요.\n\n지금 확인 가능한 주거 관련 항목은 기숙사 프로필과 통근버스예요. 실제 사내 주거 지원 규정을 HR에서 확인한 뒤 연결하면 더 정확히 안내할 수 있어요.\n집 매매를 준비 중이신가요, 아니면 전세·이사를 알아보고 계신가요?',actions:[{type:'detail',id:'bus'}]};
if(/결혼/.test(text))return {text:'결혼 소식을 알려주셨네요! 예시 복지에서 결혼 축하금 100만원과 경조휴가 5일을 찾았어요. (REG-014)\n\n아래에서 신청서를 준비하면 프로필을 자동 입력하고 행사일·증빙 메모를 확인할 수 있어요. 제출은 직접 확인한 뒤 진행됩니다.',actions:[{type:'application',id:'wed'}]};
if(/입학|자녀|학자/.test(text))return {text:eligibility(by('edu'))?'자녀 학자금 규정은 있지만, 현재 프로필에는 자녀가 등록되지 않았어요. 프로필의 자녀 수를 수정한 뒤 대상 여부를 다시 확인해 주세요. (REG-015)':'자녀 학자금은 예시 규정상 자녀 1인당 학기 50만원이에요. 재학 증빙과 납입 영수증을 확인한 후 신청서를 준비할 수 있어요. (REG-015)',actions:eligibility(by('edu'))?[{type:'detail',id:'edu'}]:[{type:'application',id:'edu'}]};
if(/이사/.test(text))return {text:'이사를 준비하고 계시는군요. 현재 예시 규정에는 별도의 이사 지원금이 없어요. 근무지와 기숙사 거주 여부를 프로필에서 변경하면 이용 가능한 복지를 다시 계산해 드려요. 통근버스 조건도 함께 확인해 보세요. (REG-006)',actions:[{type:'detail',id:'bus'}]};
if(/여기|근처|매장|할인/.test(text)){let s=stores.find(s=>s.id===activeStore)||stores[0],r=optimize(s);return {text:`위치 시뮬레이터 기준 ${s.name}에서 실제 할인 ${money(r.discount)}, 기존 복지포인트 ${money(r.points)}를 사용할 수 있어요. 결제 금액 ${money(r.amount)} 기준이며, 지도에서 매장을 선택하면 적용 순서를 확인할 수 있어요. (${by(s.benefit).reg} · REG-007)`,actions:[{type:'map'}]}}
let b=benefits.find(b=>text.includes(b.title)||text.includes(b.name)||text.includes(b.title.split(' ')[0])|| (b.id==='health'&&/검진/.test(text))|| (b.id==='point'&&/포인트/.test(text)));
if(b)return {text:`${b.title}: ${b.desc}.\n현재 자격: ${eligibility(b)||'대상 조건 충족'}. ${days(b)!==null?'마감까지 '+days(b)+'일. ':''}근거 ${b.reg}.\n아래에서 조건과 사용 여부를 확인해 주세요.`,actions:[{type:'detail',id:b.id}]};
if(/안녕|고마워|감사/.test(text))return {text:'반가워요, 트레이너님! 복지포인트, 건강검진, 결혼·자녀 학자금처럼 궁금한 복지나 생활 계획을 알려주세요.',actions:[]};
return {text:`“${text}”에 직접 해당하는 항목은 현재 예시 규정에서 찾지 못했어요. 이 데모는 등록된 규칙으로 답변하므로 자유로운 AI 상담에는 한계가 있어요.\n현재 프로필로 이용 가능한 복지는 ${eligible().length}종이에요. 건강검진이나 복지포인트, 결혼·이사처럼 구체적인 항목을 알려주시면 관련 내용을 확인해 드릴게요.`,actions:[{type:'detail',id:'health'},{type:'detail',id:'point'}]};
}
async function ask(text){
text=String(text).trim();if(!text||chatBusy)return;
let time=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}).format(new Date());
state.messages.push({role:'user',text,time});state.messages=state.messages.slice(-100);save();chatBusy=true;tab='chat';render();$('typing')?.scrollIntoView({block:'nearest',behavior:'smooth'});
await pause(700);
let answer;try{answer=demoAnswer(text)}catch{answer={text:'복지 정보를 확인하는 데 문제가 생겼어요. 프로필과 선택한 매장을 확인한 후 다시 질문해 주세요.',actions:[]}}
state.messages.push({role:'assistant',time,text:answer.text,actions:answer.actions});state.messages=state.messages.slice(-100);save();chatBusy=false;
if(tab==='chat'){chat();$('chatForm').scrollIntoView({block:'end',behavior:'smooth'});$('question').focus({preventScroll:true})}
}
function prepareApplication(text){if(!text.trim())return;if(text.includes('여기'))return agent();let id=/결혼/.test(text)?'wed':/입학|자녀|학자/.test(text)?'edu':null;if(/이사/.test(text)){modal('<h2>이사 복지 조회</h2><p>예시 규정에서 별도의 이사 지원금을 찾지 못했어요. 기숙사·통근버스 이용 조건을 확인해 주세요.</p><p class="small">근거 REG-006 · 별도 지원금은 생성하지 않습니다.</p>');return}if(!id){let b=benefits.find(b=>text.includes(b.title)||text.includes(b.name));if(b)return detail(b.id);modal(`<h2>복지 추천</h2><p>현재 프로필로 ${eligible().length}종을 이용할 수 있어요. 지도에서 제휴 매장을 선택하거나 아래 복지를 확인해 보세요.</p>${eligible().slice(0,4).map(b=>`<button class="wide" onclick="detail('${b.id}')">${b.emoji} ${b.title} · ${b.reg}</button>`).join('')}`);return}let b=by(id);steps([['💬 생애 이벤트 확인',text],['📚 규정 검색',b.title+' · '+b.reg],['🧾 자격 확인',eligibility(b)||'프로필 대상 조건 충족'],['📎 필요 서류 확인',id==='wed'?'결혼 증빙 · 행사일':'재학 증빙 · 납입 영수증'],['📝 신청서 초안 작성','프로필 자동 입력 · 제출 전 사용자 확인']],()=>{if(eligibility(b)){$('view').innerHTML+=`<div class="card"><p>${esc(eligibility(b))}. 프로필을 수정한 뒤 다시 확인해 주세요.</p><button class="wide" onclick="profile()">프로필 수정</button></div>`;return}if(got(id)){$('view').innerHTML+='<div class="card">이미 이용 완료한 복지입니다.</div>';return}let existing=state.applications.find(a=>a.benefit===id&&a.status!=='approved');draft=existing||{id:'APP-'+Date.now(),benefit:id,status:'draft'};$('view').innerHTML+=`<div class="card"><span class="pill legendary">${b.name} 포획 대기</span><h3 style="margin-top:10px">${b.title} 신청서</h3><p>사번 ${esc(state.profile.id)} · ${esc(state.profile.name)}<br>근무지 ${esc(state.profile.site)} · ${state.profile.cl}</p><p>${b.desc}</p><p class="small">근거 ${b.reg} · 실제 제출 없음</p>${draft.status==='submitted'?`<p>✓ 데모 제출 완료</p><button class="primary wide" onclick="approve('${draft.id}')">HR 승인 시뮬레이션</button>`:`<form id="applicationForm"><label>행사·학기 시작일 (입력 필요)<input id="eventDate" type="date" required></label><label>증빙 메모 (입력 필요)<input id="docNote" required placeholder="예: 결혼 증빙 확인 완료" maxlength="200"></label><p class="small">증빙 파일은 수집하지 않습니다. 메모도 데모 정보를 사용하세요.</p><button class="primary wide" type="submit">확인하고 데모 제출</button></form>`}</div>`;if($('applicationForm'))$('applicationForm').onsubmit=e=>{e.preventDefault();draft.fields={eventDate:$('eventDate').value,docs:$('docNote').value,name:state.profile.name,employee:state.profile.id};draft.status='submitted';if(!state.applications.some(a=>a.id===draft.id))state.applications.push(draft);save();$('applicationForm').outerHTML=`<p>✓ 사용자 승인 후 데모 제출 완료</p><button class="primary wide" onclick="approve('${draft.id}')">HR 승인 시뮬레이션</button>`;toast('실제 제출 없이 데모 신청 내역을 저장했어요.')}})}
function approve(id){let a=state.applications.find(a=>a.id===id);if(!a||a.status!=='submitted')return toast('제출된 신청서를 먼저 확인하세요.');if(eligibility(by(a.benefit)))return toast('프로필 변경으로 현재 자격을 충족하지 않습니다.');a.status='approved';if(got(a.benefit)){save();return toast('이미 포획한 복지입니다.')}capture(a.benefit,{method:'mock-hr',application:id})}
function ranking(){let mine=rate(),rows=rankTab==='team'?[['공정기술팀',82],['PE 1팀',71],['PE 2팀 · 우리 팀',Math.round((60*4+mine)/5)],['품질보증팀',52],['설비기술팀',41]]:[['김트레이너',83],['이꽃송이',75],[esc(state.profile.name)+' · 나',mine],['박새싹',58],['최모험',42],['정하닉',33]];rows.sort((a,b)=>b[1]-a[1]);$('view').innerHTML=`<h2>함께하는 복지 모험</h2><div class="card alert"><b>🌻 가을 시즌 · 함께 피어나는 캠퍼스</b><p class="small">랭킹은 예시 데이터입니다. 금액을 공개하지 않아요.</p></div><div class="chips"><button class="${rankTab==='team'?'blue':''}" onclick="rankTab='team';ranking()">팀 대항전</button><button class="${rankTab==='peer'?'blue':''}" onclick="rankTab='peer';ranking()">입사 동기</button></div><p class="small">활용률 = 사용한 대상 복지 수 ÷ 전체 대상 복지 수<br>팀 점수는 구성원 활용률 평균 (우리 팀: 데모 4명 + 나)</p>${rows.map(([name,n],i)=>`<div class="card rank ${name.includes('우리 팀')||name.includes(' · 나')?'mine':''}"><b class="num">${i+1}</b><div class="info"><b>${name}</b><div class="progress"><i style="width:${n}%"></i></div></div><b>${n}%</b></div>`).join('')}`}
function resetPrompt(){modal(`<h2>데모 초기화</h2><p>이 브라우저의 프로필, 포획, 신청 내역을 지웁니다.</p><button class="primary wide" onclick="localStorage.removeItem('hynixmon-v1');location.reload()">데이터 지우고 다시 시작</button>`)}
render();
</script></html>
