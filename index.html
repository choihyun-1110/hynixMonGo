function profile(){const p=state.profile||{id:'DEMO001',name:'하닉',join:plus(-120),cl:'CL2',site:'이천',married:false,children:0,dorm:true,vip:true};modal(`<h2>트레이너 프로필</h2><p class="small">실제 사번 대신 데모 정보를 사용하세요.</p><form id="profileForm"><label>데모 사번<input name="id" required value="${esc(p.id)}" maxlength="30"></label><label>이름<input name="name" required value="${esc(p.name)}" maxlength="20"></label><div class="fields"><label>입사일<input type="date" name="join" required max="${today()}" value="${p.join}"></label><label>직급<select name="cl">${['CL1','CL2','CL3','CL4'].map(v=>`<option ${v===p.cl?'selected':''}>${v}</option>`).join('')}</select></label><label>근무지<select name="site">${['이천','청주','분당'].map(v=>`<option ${v===p.site?'selected':''}>${v}</option>`).join('')}</select></label><label>자녀 수<input name="children" type="number" min="0" max="10" required value="${p.children}"></label></div>${[['married','기혼']].map(([k,n])=>`<label>${n}<select name="${k}"><option value="yes" ${p[k]?'selected':''}>예</option><option value="no" ${!p[k]?'selected':''}>아니요</option></select></label>`).join('')}<button class="primary wide" type="submit">관심 복지 살펴보기</button></form><button class="wide" onclick="resetPrompt()">데모 데이터 초기화</button>`);$('profileForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);state.profile=Object.fromEntries(f);state.profile.children=Number(f.get('children'));['married','dorm','vip'].forEach(k=>state.profile[k]=f.get(k)==='yes');save();closeModal();render();modal(`<h2>매칭 완료 ✨</h2><p>공개 자료의 복지 <b>${eligible().length}종</b> · 실제 자격은 사내 확인 필요</p>${benefits.map(b=>`<p>${eligibility(b)?'○':'✓'} ${b.title}<br><span class="small">${eligibility(b)||'세부 자격은 사내 확인 필요'} · ${b.reg}</span></p>`).join('')}`)}}
function home(){let due=eligible().filter(b=>days(b)!==null&&days(b)>=0&&days(b)<=14&&!got(b.id));$('view').innerHTML=`<div class="row"><div><div class="small">${esc(state.profile.name)} 트레이너님의</div><h2>오늘의 복지 모험</h2></div><span class="pill">${esc(state.profile.site)} 캠퍼스</span></div><div class="hud" style="margin-top:15px"><div><b>LV.${level()}</b><small>${xp()} XP</small></div><div><b>${rate()}%</b><small>${collected().length}/${eligible().length} 포획</small></div><div><b>${streak()}일</b><small>사용 스트릭</small></div></div><div class="card trainer"><p>✨ 공식 자료에서 찾은 복지 <b>${benefits.length}종</b>이에요. 내 집 마련부터 건강·학습까지 살펴볼까요?</p></div><div class="map"><svg viewBox="0 0 390 325"><path d="M-20 100L410 120M-20 245L410 235M170 -20L180 350" fill="none" stroke="#f8fbec" stroke-width="35"/><path d="M0 300Q150 250 210 310T420 260" fill="none" stroke="#93dce6" stroke-width="22"/><g fill="#9fc1d2" stroke="#fff" stroke-width="4"><rect x="75" y="140" width="64" height="55" rx="12"/><rect x="215" y="155" width="55" height="40" rx="9"/></g><g fill="#88c38e"><circle cx="35" cy="155" r="17"/><circle cx="345" cy="160" r="20"/><circle cx="130" cy="35" r="18"/><circle cx="50" cy="280" r="14"/></g></svg>${stores.map(s=>`<button class="spot" style="left:${s.x}%;top:${s.y}%" onclick="locationTrigger('${s.id}')"><strong>${s.emoji}</strong>${s.name}</button>`).join('')}<div class="avatar">${creature(by('point'),68)}</div><div class="maplabel">✦ 데모 캠퍼스 지도 · 핀을 눌러 혜택 확인</div></div><div class="card"><label style="margin:0">📍 위치 시뮬레이터<select id="location" onchange="if(this.value)locationTrigger(this.value)"><option value="">이동할 장소 선택</option>${stores.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></label><div class="small">실제 GPS·백그라운드 알림은 사용하지 않습니다.</div></div><div id="push"></div>${due.map(b=>`<div class="card deadline"><b>D-${days(b)} ${b.title} 마감</b><p>${b.id==='health'?'지정 병원 3곳의 예약 정보를 확인하세요.':'사용하지 않은 혜택이 곧 마감돼요.'}</p><button class="wide" onclick="reserve('${b.id}')">${state.reservations.includes(b.id)?'예약 정보 보기':'예약하고 포획 알림 받기'}</button></div>`).join('')}<div class="demo">SK하이닉스 공식 공개 자료 · 2026-10-03 확인<br>지도·포획·신청은 체험 기능 · 실제 사내 연결 없음</div>`}
function optimize(){throw Error('공개 자료에 할인율·잔액이 없어 계산하지 않습니다.')}

function locationTrigger(id){let s=stores.find(x=>x.id===id);if(!s)return;activeStore=id;if(tab!=='map'){tab='map';render()}let b=by(s.benefit);$('push').innerHTML=`<div class="card alert"><h3>${s.emoji} ${s.name} 복지 찾기</h3><p>${esc(b.desc)}</p><p class="small">지도는 위치 체험입니다. 실제 시설 위치·운영은 사내 확인이 필요합니다.</p><button class="primary wide" onclick="agent()">공식 근거와 이용 안내 →</button></div>`;$('push').scrollIntoView({behavior:'smooth',block:'nearest'})}

const pause=ms=>new Promise(r=>setTimeout(r,ms));async function steps(labels,onDone){let token=++flow;$('view').innerHTML=`<div class="row"><h2>AI 복지 트레이너</h2><span class="pill">● DEMO LIVE</span></div><p class="small">도구 실행 과정을 데모 스크립트로 재생합니다.</p><div id="steps"></div>`;for(let [title,detail]of labels){if(token!==flow)return;let e=document.createElement('div');e.className='step running';e.innerHTML=`<span class="spin">◌</span> ${title}<small>${esc(detail)}</small>`;$('steps').append(e);await pause(550);if(token!==flow)return;e.className='step';e.innerHTML=`✓ ${title}<small>${esc(detail)}</small>`}if(token===flow)onDone()}
function agent(){let s=stores.find(x=>x.id===activeStore),b=by(s?.benefit||activeStore);if(!b)return;steps([['📍 장소 선택',s?.name||b.title],['📚 공개 자료 확인',b.sourceTitle],['🔎 이용 조건 확인',b.unknownFields+'는 사내 확인 필요']],()=>{$('view').innerHTML+=`<div class="card"><h2>${b.title}</h2><p>${esc(b.desc)}</p><p class="small">실제 자격·신청 방법은 사내 복지 채널에서 확인해 주세요.</p><button class="wide" onclick="detail('${b.id}')">상세 정보 보기</button><button class="primary wide" onclick="recordUse('${b.id}')">이용 후 사용 기록 남기기 →</button></div>${sourceCard(b)}`})}

function barcode(){modal(`<h2>데모 멤버십 카드</h2><div style="height:100px;margin:22px 10px;background:repeating-linear-gradient(90deg,#1c2f5e 0 3px,white 3px 6px,#1c2f5e 6px 7px,white 7px 11px)"></div><p class="small">실제 결제에 사용할 수 없는 데모 바코드입니다.<br>DEMO · ${esc(state.profile.id)}</p>`)}
function reserve(id){let b=by(id);if(!b)return;if(!state.reservations.includes(id)){state.reservations.push(id);save()}modal(`<h2>${b.title} 이용 안내</h2><p>관심 항목을 브라우저에 저장했습니다. 실제 예약·신청은 사내 채널에서 확인해 주세요.</p>${sourceCard(b)}`)}

function recordUse(id){let b=by(id);if(!b||got(id))return toast('이미 기록한 복지입니다.');activeStore=id;if(id==='medical')return receipt(0);modal(`<h2>${id==='bus'?'통근버스 탑승 기록':b.title+' 이용 기록'}</h2><p>${id==='bus'?'통근버스는 무료이므로 영수증·결제 금액을 요구하지 않습니다. 실제로 탑승한 뒤 기록해 주세요.':'실제로 이용한 뒤 기록해 주세요. 결제가 없는 이용에 영수증을 요구하지 않습니다.'}</p><p class="small">본인 확인으로 남기는 체험 기록입니다. 회사의 탑승·출입·수강 시스템과 연동된 인증은 아닙니다.</p><label>이용일<input id="useDate" type="date" value="${today()}" max="${today()}"></label><button class="primary wide" onclick="confirmUse('${id}')">${id==='bus'?'탑승했어요 · 기록하기':'이용했어요 · 기록하기'}</button>`)}
function confirmUse(id){let date=$('useDate').value;if(!by(id)||got(id))return toast('이미 기록한 복지입니다.');if(!date||date>today())return toast('이용일을 확인하세요.');closeModal();capture(id,{date,method:'self-report',store:id==='bus'?'통근버스 탑승':by(id).title+' 이용',catalogVersion:CATALOG_VERSION})}
let receiptAmount=0;function receipt(amount){receiptAmount=amount;pendingHash=null;receiptURL=null;$('view').innerHTML=`<h2>사용 확인으로 포획하기</h2><p class="small">데모 OCR · 실제 자동 인식은 연결되지 않았습니다.</p><div class="card"><h3>1. 영수증 또는 이용 증빙</h3><label>이미지 선택<input id="upload" type="file" accept="image/*" capture="environment" onchange="uploadReceipt(this.files[0])"></label><div id="preview"></div><button class="wide" onclick="sampleReceipt()">샘플 영수증으로 시연</button></div><div id="manual"></div>`}
async function hashBlob(blob){let buf=new Uint8Array(await blob.arrayBuffer());if(globalThis.crypto?.subtle){let hash=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=2166136261;for(let x of buf)h=Math.imul(h^x,16777619);return buf.length+'-'+(h>>>0).toString(16)}
async function uploadReceipt(file){if(!file)return;if(!file.type.startsWith('image/'))return toast('이미지 파일을 선택하세요.');if(file.size>10*1024*1024)return toast('10MB 이하 이미지를 선택하세요.');pendingHash=await hashBlob(file);if(state.hashes.includes(pendingHash))return toast('이미 확인한 영수증입니다. 중복 포획을 막았어요.');receiptURL=URL.createObjectURL(file);$('preview').innerHTML=`<div class="preview"><img class="receipt" src="${receiptURL}" alt="업로드한 영수증 미리보기"><div class="scan"></div></div>`;await pause(1000);$('preview').querySelector('.scan')?.remove();manualReceipt(false)}
async function sampleReceipt(){pendingHash='demo-receipt-'+activeStore+'-'+today();if(state.hashes.includes(pendingHash))return toast('오늘의 샘플 영수증은 이미 사용했습니다.');let s=stores.find(s=>s.id===activeStore);$('preview').innerHTML=`<div class="card" style="font-family:monospace;text-align:center"><b>DEMO RECEIPT</b><p>${s?.name||by(activeStore).title+' 이용처'}<br>${today()}<br>결제 ${money(receiptAmount)}<br>혜택 사용 확인 · DEMO</p></div>`;manualReceipt(true)}
function manualReceipt(sample){let s=stores.find(s=>s.id===activeStore),b=s?by(s.benefit):by(activeStore);$('manual').innerHTML=`<div class="card"><span class="pill">${sample?'샘플 데이터':'OCR 미연결 → 수동 확인'}</span><h3 style="margin-top:12px">2. 사용 내역 확인</h3><p class="small">이미지를 실제로 읽은 결과가 아닙니다. 아래 정보를 직접 확인하세요.</p><label>사용 매장<input id="receiptStore" value="${s?.name||by(activeStore).title+' 이용처'}"></label><label>사용일<input id="receiptDate" type="date" value="${today()}" max="${today()}"></label><label>결제 금액<input id="receiptValue" type="number" min="0" max="10000000" value="${receiptAmount}"></label><label>사용한 복지<select id="receiptBenefit">${eligible().filter(x=>(s?[s.benefit]:[activeStore]).includes(x.id)).map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${x.title}</option>`).join('')}</select></label><p class="small">영수증 1장당 선택한 복지 1종 포획. ${b.reg}</p><button class="primary wide" onclick="confirmReceipt()">내역 확인 완료 · 데모 인증</button></div>`}
function confirmReceipt(){let id=$('receiptBenefit').value,amount=Number($('receiptValue').value),date=$('receiptDate').value,store=$('receiptStore').value.trim();if(!by(id)||!pendingHash)return toast('항목과 증빙을 먼저 선택하세요.');if(state.hashes.includes(pendingHash))return toast('이미 사용한 증빙입니다.');if(got(id))return toast('이미 포획한 복지입니다.');if(!store||!date||date>today()||!Number.isFinite(amount)||amount<0||amount>10000000)return toast('매장·사용일·금액을 확인하세요.');state.hashes.push(pendingHash);capture(id,{store,date,amount,method:'demo-manual',catalogVersion:CATALOG_VERSION});if(receiptURL)URL.revokeObjectURL(receiptURL)}

async function capture(id,meta={}){let old=level(),oldBadges=badges();state.usage.push({benefit:id,date:today(),...meta});save();let b=by(id),token=++flow;$('nav').style.display='none';$('view').innerHTML=`<div class="capture"><span class="pill ${b.rarity}">${b.title} 사용 확인</span><h2 style="margin:20px 0">야생의 ${b.name}!</h2>${creature(b,185)}<div id="caps" class="capsule">${capsule(80)}</div><p id="captureText">꽃봉오리 캡슐이 열려요…</p></div>`;$('caps').classList.add('throw');await pause(1000);if(token!==flow)return;$('caps').className='capsule shake';await pause(1800);if(token!==flow)return;$('captureText').innerHTML=`<b class="success">✦ 포획 성공! ✦</b><br>+${b.xp} XP · 도감에 등록했어요.<button class="primary wide" onclick="navigate('dex')">도감에서 만나기 →</button><button class="wide" onclick="navigate('map')">모험 계속하기</button>`;let earned=badges().filter(x=>!oldBadges.includes(x));if(earned.length)toast('새 뱃지: '+earned.join(' · '));if(level()>old)modal(`<div class="level card"><span class="pill">LEVEL UP</span><h1>LV.${level()}</h1><p>트레이너의 모험이 한 단계 성장했어요!</p></div>`)}
function dex(){$('view').innerHTML=`<h2>나의 복지 도감</h2><p class="small">사용한 혜택이 나만의 꽃송이로 피어나요.</p><div class="card"><div class="row"><b>${collected().length} / ${eligible().length} 관심 복지</b><h2>${rate()}%</h2></div><div class="progress"><i style="width:${rate()}%"></i></div></div><div class="chips">${[['all','전체'],['common','일반'],['rare','희귀'],['legendary','전설']].map(([k,n])=>`<button class="${filter===k?'blue':''}" onclick="filter='${k}';dex()">${n}</button>`).join('')}</div><div class="grid">${benefits.filter(b=>filter==='all'||b.rarity===filter).map(b=>`<button class="mon ${got(b.id)?'':'locked'}" onclick="detail('${b.id}')">${creature(b,90)}<b>${got(b.id)?b.name:b.title}</b><span class="pill ${b.rarity}">${{common:'일반',rare:'희귀',legendary:'전설'}[b.rarity]}</span><div class="small">${eligibility(b)?'시설 지역 확인':'공식 공개 복지'}</div></button>`).join('')}</div>`}
function detail(id){let b=by(id),u=state.usage.find(x=>x.benefit===id);modal(`<div style="text-align:center">${creature(b,145)}<h2>${b.name}</h2><span class="pill ${b.rarity}">${b.title} · +${b.xp} XP</span></div><p>${b.desc}</p><p class="small">안내: ${eligibility(b)||'세부 자격은 사내 확인 필요'}<br>공개 자료 항목 ${b.reg}${days(b)!==null?'<br>마감까지 '+days(b)+'일':''}<br>${u?'획득일 '+u.date+' · '+esc(u.store||'데모 신청 승인'):id==='bus'?'무료 통근버스 · 영수증 없이 탑승 기록을 남깁니다.':'이용 방식에 맞게 사용 기록을 남기면 포획돼요.'}</p>${sourceCard(b)}${u?`<div class="card"><p>인증 방식: ${u.method==='self-report'?'본인 이용 확인 · 실제 회사 인증 아님':u.method==='demo-manual'?'데모 수동 확인':'HR 승인 시뮬레이션'}<br>${u.amount!==undefined?'결제 '+money(u.amount):''}</p><p class="small">증빙 이미지는 개인정보 보호를 위해 저장하지 않습니다.</p></div>`:`<button class="primary wide" onclick="closeModal();navigate('chat');ask('${b.title} 알려줘')">AI 트레이너에게 물어보기</button>${['housing','wed','edu'].includes(id)?`<button class="wide" onclick="closeModal();prepareApplication('${b.title}')">신청 준비 체험 →</button>`:''}${!eligibility(b)&&!['housing','wed','edu'].includes(id)?`<button class="wide" onclick="closeModal();recordUse('${id}')">${id==='bus'?'탑승 기록 남기기':'이용 기록 남기기'}</button>`:''}`}`)}
function bag(){$('view').innerHTML=`<h2>트레이너의 가방</h2><div class="card"><div class="row"><b>복지포인트 잔액</b><h2>사내 확인</h2></div><p class="small">매년 SK hywel 포인트 지급 · 실제 잔액·유효기간은 사내 확인</p></div><h3 style="margin-top:20px">획득한 뱃지</h3><div class="chips">${badges().map(x=>`<span class="pill">${x}</span>`).join('')||'<p class="small">첫 혜택을 사용하면 첫 포획 뱃지를 받아요.</p>'}</div><h3 style="margin-top:20px">신청 내역</h3>${state.applications.map(a=>`<div class="card"><b>${by(a.benefit).title}</b><p>${a.status==='approved'?'승인 완료':'데모 제출 · 승인 대기'} · ${esc(a.fields?.eventDate||'')}</p>${a.status==='submitted'?`<button class="wide" onclick="approve('${a.id}')">HR 승인 시뮬레이션</button>`:''}</div>`).join('')||'<p class="small">저장된 신청 내역이 없습니다.</p>'}${state.previousCatalog?.usage?.length||state.previousCatalog?.applications?.length?'<div class="card"><p>공개 복지 자료로 업데이트했습니다. 변경 전 예시 포획·신청 기록은 별도 보관했습니다.</p></div>':''}<h3 style="margin-top:20px">내 복지 카드</h3>${state.usage.map(u=>`<button class="card wide row" onclick="detail('${u.benefit}')">${creature(by(u.benefit),65)}<div><b>${by(u.benefit).name}</b><p class="small">${by(u.benefit).title} · ${u.date}</p></div>→</button>`).join('')||'<div class="empty">🌱<p>아직 피어난 꽃송이가 없어요.<br>지도에서 첫 혜택을 찾아보세요.</p></div>'}`}
const CHAT_API = 'https://hynixmon-gpt.chlgusla1.chatgpt.site/chat'; // Set to deployed server /chat URL; never put an API key here.
let chatBusy=false;
state.messages=Array.isArray(state.messages)?state.messages:[];
state.messages.forEach(m=>{if(m.role==='assistant'&&m.text==='서버의 OpenAI API 키를 확인해야 합니다.')m.provider='error'});
function conversation(){return state.messages.map(m=>`<div class="chat ${m.role==='user'?'user':''}"><div class="small">${m.role==='user'?'나':m.provider==='error'?'⚠ 연결 오류':'✨ 복지 트레이너'} · ${esc(m.time||'')}${m.legacy?' · 변경 전 예시 데이터 대화':''}</div>${m.search?.used?`<div class="small">🔎 ${m.search.status==='failed'?'웹 검색 일부 실패':'웹 검색 실행'} · ${Number(m.search.calls)||0}회</div>`:''}<p style="white-space:pre-wrap">${esc(m.text)}</p>${(m.sources||[]).filter(c=>/^https?:\/\//i.test(c.url)).map((c,i)=>`<p class="small"><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">[${i+1}] ${esc(c.title)} ↗</a></p>`).join('')}${(m.actions||[]).filter(a=>a.type==='map'||by(a.id)).map(a=>a.type==='map'?`<button class="wide" onclick="navigate('map')">지도 보기 →</button>`:`<button class="wide" onclick="detail('${a.id}')">${by(a.id).emoji} ${by(a.id).title} 상세 보기 →</button>`).join('')}</div>`).join('')}

function chat(){
$('view').innerHTML=`<div class="row"><h2>AI 복지 트레이너</h2><span class="pill">${CHAT_API?'Claude 연결':'DEMO'}</span></div><div class="chat">안녕하세요, ${esc(state.profile.name)} 트레이너님! 어떤 복지가 궁금하세요?<br><span class="small">${CHAT_API?'Claude 답변 · 공식 공개 복지 자료 + 필요 시 웹 검색<br>질문·최근 대화·근무지·자녀 수를 서버와 Anthropic에 전달합니다. 이름·사번·증빙은 전달하지 않습니다.':'규칙 기반 데모 응답 · 실제 LLM 연결 없음'}<br>대화는 이 브라우저에 저장됩니다. 데모 정보로 대화하세요.</span></div><div class="chips">${['성과급 얼마받을것같아?','집사고 싶어','저 다음 달에 결혼해요','이사해요','아이가 입학해요','여기서 뭐 쓸 수 있어?'].map(t=>`<button ${chatBusy?'disabled':''} onclick="ask('${t}')">${t}</button>`).join('')}</div><div id="messages" role="log" aria-label="트레이너 대화" aria-live="polite">${conversation()}${chatBusy?'<div class="chat" id="typing"><span class="spin">◌</span> 트레이너가 자료를 확인하고 있어요. 웹 검색은 시간이 조금 걸릴 수 있어요…</div>':''}</div><form id="chatForm"><label>트레이너에게 질문<input id="question" placeholder="예: 집사고 싶어" required maxlength="300" ${chatBusy?'disabled':''}></label><button class="primary wide" ${chatBusy?'disabled':''}>${chatBusy?'답변 확인 중…':'보내기 ✨'}</button></form>`;
$('chatForm').onsubmit=e=>{e.preventDefault();ask($('question').value)};
}
function demoAnswer(text){let b=/집.*사|주택|전세|이사/.test(text)?by('housing'):/결혼/.test(text)?by('wed'):/학자|입학/.test(text)?by('edu'):benefits.find(b=>text.includes(b.title));return b?{text:b.title+': '+b.desc+'\n사내 확인 필요: '+b.unknownFields+'\n공식 출처: '+b.sourceUrl,actions:[{type:'detail',id:b.id}]}:{text:'공개 복지 자료에서 관련 항목을 확인해 주세요.',actions:[{type:'detail',id:'housing'},{type:'detail',id:'point'}]}}

async function llmAnswer(){
const p=state.profile;
const messages=state.messages.filter(m=>m.provider!=='error'&&!m.legacy).slice(-12).map(m=>({role:m.role,content:m.text.slice(0,1000)}));
const tenureMonths=Math.max(0,Math.floor((Date.now()-new Date(p.join).getTime())/(86400000*30.4375)));
const response=await fetch(CHAT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,profile:{site:p.site,children:p.children}}),signal:AbortSignal.timeout(75000)});
const data=await response.json();
if(!response.ok){const errors={RATE_LIMITED:'데모 AI 사용량 한도에 도달했어요. 잠시 후 또는 내일 다시 시도해 주세요.',OPENAI_QUOTA_OR_RATE_LIMIT:'OpenAI 사용량 또는 결제 한도를 확인해야 합니다.',OPENAI_KEY_INVALID:'서버의 OpenAI API 키를 확인해야 합니다.',ANTHROPIC_KEY_INVALID:'서버의 Claude API 키를 확인해야 합니다.',ANTHROPIC_CREDIT_REQUIRED:'Anthropic API 크레딧 충전이 필요합니다.',ANTHROPIC_RATE_LIMIT:'Claude 요청이 많습니다. 잠시 후 다시 시도해 주세요.',ANTHROPIC_ACCESS_DENIED:'Claude API 키의 사용 권한을 확인해야 합니다.',ANTHROPIC_MODEL_UNAVAILABLE:'Claude 모델 설정을 확인해야 합니다.',WEB_SEARCH_NOT_ENABLED:'Claude 계정에서 웹 검색 사용을 활성화해야 합니다.',SEARCH_INCOMPLETE:'검색이 길어져 완료하지 못했어요. 질문을 구체적으로 다시 보내 주세요.',SERVER_NOT_CONFIGURED:'Claude 서버의 API 키가 아직 설정되지 않았어요.'};throw Error(errors[data.error]||'Claude 서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요.')}
if(typeof data.text!=='string'||!data.text)throw Error('Claude 답변을 받지 못했어요.');
let actions=[],last=messages.at(-1).content;
if(/집.*사|주택|전세|주거|이사/.test(last))actions=[{type:'detail',id:'housing'}];
else if(/결혼/.test(last))actions=[{type:'application',id:'wed'}];
else if(/입학|학자/.test(last)&&!eligibility(by('edu')))actions=[{type:'application',id:'edu'}];
return {text:data.text,provider:data.provider,model:data.model,sources:data.sources,search:data.search,actions};
}
async function ask(text){
text=String(text).trim();if(!text||chatBusy)return;
let time=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit'}).format(new Date());
state.messages.push({role:'user',text,time});state.messages=state.messages.slice(-100);save();chatBusy=true;tab='chat';render();$('typing')?.scrollIntoView({block:'nearest',behavior:'smooth'});
await pause(700);
let answer;try{answer=CHAT_API?await llmAnswer():demoAnswer(text)}catch(error){answer={provider:'error',text:CHAT_API?(error.message||'Claude 연결에 실패했어요. 잠시 후 다시 보내 주세요.'):'복지 정보를 확인하는 데 문제가 생겼어요. 프로필과 선택한 매장을 확인한 후 다시 질문해 주세요.',actions:[]}}
state.messages.push({role:'assistant',time,text:answer.text,actions:answer.actions,provider:answer.provider,model:answer.model,sources:answer.sources,search:answer.search});state.messages=state.messages.slice(-100);save();chatBusy=false;
if(tab==='chat'){chat();$('chatForm').scrollIntoView({block:'end',behavior:'smooth'});$('question').focus({preventScroll:true})}
}
function prepareApplication(text){let id=/결혼/.test(text)?'wed':/입학|자녀|학자/.test(text)?'edu':/집|주택|전세|이사/.test(text)?'housing':null;if(!id)return navigate('dex');let b=by(id);draft={id:'APP-'+Date.now(),benefit:id,status:'draft'};$('view').innerHTML=`<h2>${b.title} 신청 준비</h2><p>${esc(b.desc)}</p>${sourceCard(b)}<div class="card"><p>사내 신청 전 계획을 정리하는 체험입니다. 실제 제출·승인·지급은 진행하지 않습니다.</p><form id="applicationForm"><label>희망일<input id="eventDate" type="date" required></label><label>신청 목적 메모<input id="docNote" required maxlength="200" placeholder="예: 대출 조건 확인"></label><p class="small">제출 서류·채널은 사내 확인 필요. 개인정보·금융정보를 적지 마세요.</p><button class="primary wide">체험 신청 내역 저장</button></form></div>`;$('applicationForm').onsubmit=e=>{e.preventDefault();draft.fields={eventDate:$('eventDate').value,docs:$('docNote').value};draft.status='submitted';state.applications.push(draft);save();$('applicationForm').outerHTML=`<p>체험 신청 저장 완료</p><button class="wide" onclick="approve('${draft.id}')">승인 시뮬레이션</button>`}}

function approve(id){let a=state.applications.find(a=>a.id===id);if(!a||a.status!=='submitted')return toast('제출된 신청서를 먼저 확인하세요.');if(eligibility(by(a.benefit)))return toast('프로필 변경으로 현재 자격을 충족하지 않습니다.');a.status='approved';if(got(a.benefit)){save();return toast('이미 포획한 복지입니다.')}capture(a.benefit,{method:'mock-hr',application:id})}
function ranking(){let mine=rate(),rows=rankTab==='team'?[['R&D 공정',82],['소자',71],['Product Engineering · 우리 팀',Math.round((83+75+58+42+33+mine)/6)],['양산기술',52],['양산관리',41]]:[['김민영',83],['윤홍빈',75],['최현 · 나',mine],['신재호',58],['김상훈',42],['허승현',33]];rows.sort((a,b)=>b[1]-a[1]);$('view').innerHTML=`<h2>함께하는 복지 모험</h2><a class="small" href="https://www.skcareers.com/Recruit/Detail/R260521" target="_blank" rel="noopener">SK하이닉스 공식 채용 직무 출처 ↗</a><div class="card alert"><b>🌻 가을 시즌 · 함께 피어나는 캠퍼스</b><p class="small">팀은 SK하이닉스 JD 직무명으로 구성한 예시입니다. 활용률은 데모 수치이며 실제 팀원 이용 내역이 아닙니다.</p></div><div class="chips"><button class="${rankTab==='team'?'blue':''}" onclick="rankTab='team';ranking()">팀 대항전</button><button class="${rankTab==='peer'?'blue':''}" onclick="rankTab='peer';ranking()">입사 동기</button></div><p class="small">활용률 = 사용한 관심 복지 수 ÷ 전체 관심 복지 수<br>팀 점수는 구성원 활용률 평균 (우리 팀: 데모 5명 + 나)</p>${rows.map(([name,n],i)=>`<div class="card rank ${name.includes('우리 팀')||name.includes(' · 나')?'mine':''}"><b class="num">${i+1}</b><div class="info"><b>${name}</b><div class="progress"><i style="width:${n}%"></i></div></div><b>${n}%</b></div>`).join('')}`}
function resetPrompt(){modal(`<h2>데모 초기화</h2><p>이 브라우저의 프로필, 포획, 신청 내역을 지웁니다.</p><button class="primary wide" onclick="localStorage.removeItem('hynixmon-v1');location.reload()">데이터 지우고 다시 시작</button>`)}
render();

</script></html>
